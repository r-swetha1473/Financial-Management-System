services:
  postgres:
    image: postgres:16-alpine
    container_name: bfms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bfms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bfms_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-bfms}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bfms} -d ${POSTGRES_DB:-bfms}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
