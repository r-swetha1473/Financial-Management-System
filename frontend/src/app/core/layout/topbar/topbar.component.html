<header class="topbar">
  <div class="topbar__left">
    <button class="topbar__menu-btn" type="button" (click)="menuToggle.emit()" aria-label="Open navigation">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M4 6h16M4 12h16M4 18h16" />
      </svg>
    </button>
    <button class="topbar__icon-btn topbar__collapse-btn" type="button" (click)="collapseToggle.emit()" aria-label="Collapse sidebar">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M4 6h16M4 12h10M4 18h16" />
      </svg>
    </button>
    <div class="topbar__search">
      <svg class="topbar__search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="7" />
        <path d="m20 20-3-3" />
      </svg>
      <input class="topbar__search-input" type="search" placeholder="Search invoices, vendors, customers..." />
    </div>
  </div>

  <div class="topbar__right">
    <div class="topbar__org">
      <span class="topbar__org-label">Organization</span>
      <span class="topbar__org-name">{{ session()?.organizationName }}</span>
    </div>
    <button class="topbar__icon-btn" type="button" aria-label="Notifications">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M6 8a6 6 0 1 1 12 0c0 7 3 7 3 9H3s3-2 3-9" />
        <path d="M10 20a2 2 0 0 0 4 0" />
      </svg>
    </button>
    <div class="topbar__user-wrap">
      <button class="topbar__user" type="button" (click)="menuOpen.set(!menuOpen())">
        <span class="topbar__avatar">{{ initials() }}</span>
        <span class="topbar__user-info">
          <span class="topbar__user-name">{{ session()?.fullName }}</span>
          <span class="topbar__user-role">{{ session()?.role }}</span>
        </span>
      </button>
      @if (menuOpen()) {
        <div class="user-menu">
          <div class="user-menu__meta">{{ session()?.email }}</div>
          @if (canAdmin()) {
            <a class="user-menu__item" routerLink="/admin/settings" (click)="menuOpen.set(false)">Settings</a>
          }
          <button class="user-menu__item" type="button" (click)="logout()">Sign out</button>
        </div>
      }
    </div>
  </div>
</header>
