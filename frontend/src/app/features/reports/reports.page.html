<div class="page">
  <app-page-header
    title="Reports"
    subtitle="Live aggregations from this organization's records. CSV export is on each report."
  />

  <app-filter-bar
    searchPlaceholder="Search reports..."
    [search]="search"
    (changed)="onFilters($event)"
  />

  <div class="overview-grid">
    @for (report of visibleReports; track report.route) {
      <a class="overview-card" [routerLink]="report.route">
        <h3>{{ report.title }}</h3>
        <p>{{ report.description }}</p>
      </a>
    }
  </div>
</div>
