<div class="page">
  <app-page-header
    title="Reports"
    subtitle="Export-ready layouts. CSV/PDF generation will attach to these screens when the backend export APIs are available."
  />

  <div class="overview-grid">
    @for (report of reports; track report.route) {
      <a class="overview-card" [routerLink]="report.route">
        <h3>{{ report.title }}</h3>
        <p>{{ report.description }}</p>
      </a>
    }
  </div>
</div>
