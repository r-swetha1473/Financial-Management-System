<div class="page">
  <app-page-header title="Reconciliation" subtitle="Not connected to a bank feed. Manual notes only — no matching, import, or statement logic." />
  <app-finance-banner description="A bank connection is not in this product yet. Use the note field for working comments. This does not change any balances." />
  @if (loading()) { <app-loading-skeleton /> }
  @else if (error()) { <div class="error-state"><h3>{{ error() }}</h3></div> }
  @else {
    <div class="card">
      <app-empty-state title="No bank feed connected" message="Statement import and match-to-book are not built. Nothing here posts or unposts transactions." />
    </div>
    <article class="card" style="margin-top: 1rem;">
      <div class="card__header"><h3 class="card__title">Working notes</h3></div>
      <div class="card__body">
        <textarea class="form-input" rows="8" [(ngModel)]="note" [readOnly]="!canEdit()" placeholder="Optional notes for this organization."></textarea>
        @if (updatedAt) { <p class="form-field__hint" style="margin-top: 0.5rem;">Last saved {{ updatedAt }}</p> }
        @if (canEdit()) {
          <div style="margin-top: 1rem;">
            <button class="btn btn--primary" type="button" [disabled]="saving()" (click)="save()">Save note</button>
          </div>
        }
      </div>
    </article>
  }
</div>
