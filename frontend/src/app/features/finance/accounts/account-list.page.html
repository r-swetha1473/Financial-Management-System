<div class="page">
  <app-page-header title="Accounts" subtitle="Single implicit Operating cash account. Balance is cash-basis movement from CashPositionService — not a multi-account ledger." />
  <app-finance-banner description="No account creation, transfers, or opening-balance UI. The row is created when the first expense posts, or on first visit here." />
  <app-filter-bar
    searchPlaceholder="Search accounts..."
    [search]="search"
    (changed)="onFilters($event)"
  />
  @if (loading()) { <app-loading-skeleton /> }
  @else if (error()) { <div class="error-state"><h3>{{ error() }}</h3></div> }
  @else if (items.length === 0) { <div class="card"><app-empty-state title="No operating cash account" message="Record an expense or reload this page to materialize the implicit account." /></div> }
  @else {
    <div class="data-table-wrap">
      <table class="data-table">
        <thead><tr><th>Account</th><th>Type</th><th class="col-amount">Balance</th><th>Status</th></tr></thead>
        <tbody>
          @for (row of visibleItems; track row.id) {
            <tr>
              <td><a class="table-link" [routerLink]="['/finance/transactions']" [queryParams]="{ accountId: row.id }">{{ row.name }}</a></td>
              <td>{{ row.accountType }}</td>
              <td class="col-amount">{{ row.balance | inr }}</td>
              <td><app-status-badge [status]="row.isActive ? 'active' : 'inactive'" /></td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  }
</div>
