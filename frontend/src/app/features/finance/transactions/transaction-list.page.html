<div class="page">
  <app-page-header title="Transactions" subtitle="finance_transactions only. P2P payments and O2C collections are kept on their own pages and are not merged here." />
  <app-finance-banner description="Debit rows are expenses posted to Operating cash. This is not a general journal and has no manual posting form." />
  <app-filter-bar
    searchPlaceholder="Search description..."
    [search]="search"
    [selects]="filterSelects"
    (changed)="onFilters($event)"
  />
  @if (loading()) { <app-loading-skeleton /> }
  @else if (error()) { <div class="error-state"><h3>{{ error() }}</h3></div> }
  @else if (items.length === 0) { <div class="card"><app-empty-state title="No transactions" message="Record an expense to post a debit against Operating cash." /></div> }
  @else {
    <div class="data-table-wrap">
      <table class="data-table">
        <thead><tr><th>Date</th><th>Account</th><th>Type</th><th class="col-amount">Amount</th><th>Description</th></tr></thead>
        <tbody>
          @for (row of items; track row.id) {
            <tr>
              <td>{{ row.transactionDate }}</td>
              <td>{{ row.accountName }}</td>
              <td><app-status-badge [status]="row.transactionType" /></td>
              <td class="col-amount">{{ row.amount | inr }}</td>
              <td>{{ row.description || '—' }}</td>
            </tr>
          }
        </tbody>
      </table>
      <app-pagination [page]="page" [total]="total" (pageChange)="page = $event; load()" />
    </div>
  }
</div>
