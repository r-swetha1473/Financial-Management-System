<div class="page">
  <app-page-header title="GST / Tax" subtitle="Input and output GST from stored GST amounts. CGST, SGST, and IGST are not split in the current records.">
    <a class="btn btn--secondary" routerLink="/reports/gst">Open GST report</a>
  </app-page-header>
  <app-finance-banner description="GST amount is stored separately on expenses and invoices and is not added to those document totals." />
  <div class="dashboard-section grid grid--3">
    <app-summary-card label="Input GST" [value]="gst.inputGst" tone="payable" meta="Expenses + supplier invoices" />
    <app-summary-card label="Output GST" [value]="gst.outputGst" tone="income" meta="GST invoices + O2C sales invoices" />
    <app-summary-card label="Net (output − input)" [value]="gst.net" tone="cash" />
  </div>
  <article class="card">
    <div class="card__header"><h3 class="card__title">Breakdown</h3></div>
    <div class="card__body">
      <dl class="detail-list">
        <dt>Expense GST</dt><dd>{{ gst.expenses | inr }}</dd>
        <dt>Supplier invoice GST</dt><dd>{{ gst.supplier | inr }}</dd>
        <dt>Existing GST invoices</dt><dd>{{ gst.outputLegacy | inr }}</dd>
        <dt>O2C sales invoice GST</dt><dd>{{ gst.outputO2c | inr }}</dd>
      </dl>
      <p class="form-field__hint" style="margin-top: 1rem;">A dedicated tax-line structure is required before CGST / SGST / IGST can be shown.</p>
    </div>
  </article>
</div>
